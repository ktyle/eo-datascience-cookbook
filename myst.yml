version: 1
extends:
  - https://raw.githubusercontent.com/projectpythia/pythia-config/main/pythia.yml
project:
  title: Earth Observation Data Science Cookbook
  authors:
    - name: Wolfgang Wagner
    - name: Martin Schobben
    - name: Nikolas Pikall
    - name: Joseph Wagner
    - name: Davide Festa
    - name: Felix David Reuß
    - name: Luka Jović
  copyright: '2024'
  settings:
    output_matplotlib_strings: remove
  toc:
    - file: README.md
    - title: Preamble
      children:
        - file: notebooks/how-to-cite.md
    - title: Courses
      children:
        - file: notebooks/courses/microwave-remote-sensing.ipynb
          children:
            - file: notebooks/courses/microwave-remote-sensing/Exercise-01.ipynb
            - file: notebooks/courses/microwave-remote-sensing/Exercise-02.ipynb
            - file: notebooks/courses/microwave-remote-sensing/Exercise-03.ipynb
            - file: notebooks/courses/microwave-remote-sensing/Exercise-04.ipynb
            - file: notebooks/courses/microwave-remote-sensing/Exercise-05.ipynb
            - file: notebooks/courses/microwave-remote-sensing/Exercise-06.ipynb
            - file: notebooks/courses/microwave-remote-sensing/Exercise-07.ipynb
            - file: notebooks/courses/microwave-remote-sensing/Exercise-08.ipynb
            - file: notebooks/courses/microwave-remote-sensing/Exercise-09.ipynb
    - title: Templates
      children:
        - file: notebooks/templates/prereqs-templates.ipynb
          children:
            - file: notebooks/templates/classification.ipynb
    - title: Tutorials
      children:
        - file: notebooks/tutorials/prereqs-tutorials.ipynb
          children:
            - file: notebooks/tutorials/floodmapping.ipynb
    - title: References
      children:
            - file: notebooks/references.ipynb
  jupyter:
      binder:
        repo: projectpythia/eo-datascience-cookbook
site:
  options:
    logo: notebooks/images/logos/pythia_logo-white-rtext.svg
    folders: true
